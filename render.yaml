services:
  - type: web
    name: all-time-xi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -X utf8 -m uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: AI_PROVIDER
        value: engine
